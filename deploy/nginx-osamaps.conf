# À inclure dans le bloc server 443 du site « osalabs » (avant location /).
# Installé par deploy.sh dans /etc/nginx/snippets/osamaps.conf + « include snippets/osamaps.conf; ».
location = /maps { return 301 /maps/; }

location /maps/api/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 64k;
}

location /maps/socket.io/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
}

location /maps/ {
    alias /var/www/osamaps/web/;
    try_files $uri $uri/ /maps/index.html;
    location ~* ^/maps/assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /maps/sw.js { add_header Cache-Control "no-cache"; }
    location = /maps/index.html { add_header Cache-Control "no-cache"; }
}
