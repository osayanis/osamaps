name: OsaMaps
options:
  bundleIdPrefix: fr.osalabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OsaMaps:
    type: application
    platform: iOS
    sources:
      - path: OsaMaps
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.osalabs.osamaps
        INFOPLIST_FILE: OsaMaps/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: OsaMapsLive
  OsaMapsLive:
    type: app-extension
    platform: iOS
    sources:
      - path: OsaMapsLive
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.osalabs.osamaps.live
        INFOPLIST_FILE: OsaMapsLive/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OsaMaps:
    build:
      targets:
        OsaMaps: all
    run:
      config: Debug
